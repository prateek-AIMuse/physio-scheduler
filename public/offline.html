<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3A6E">
<title>Offline · Movera</title>
<style>
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #fff; background: linear-gradient(140deg, #071833 0%, #0B3A6E 50%, #0B6E6A 100%); text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 18px; display: block; }
  h1 { margin: 0 0 8px; font-size: 1.5rem; }
  p { margin: 0 0 20px; opacity: 0.85; }
  button { font: inherit; font-weight: 700; padding: 12px 22px; border-radius: 14px; border: 0; background: #fff; color: #0A1F3D; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Check your internet connection, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
